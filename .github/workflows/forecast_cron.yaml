name: Run Energy Forecast Notebook

on:
  schedule:
    - cron: '0 8 * * 4'
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests holidays lightgbm jupyter nbconvert ipykernel

      - name: Run Notebook
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: jupyter nbconvert --to notebook --execute main.ipynb --output main.ipynb

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update energy forecast data"
          file_pattern: 'full_dataset.json forecast_model_*.txt'
